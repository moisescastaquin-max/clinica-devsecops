name: devsecops
on: push

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - run: semgrep scan --config rules/sql-taint.yml --error --metrics=off .

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only
      - run: npm audit --audit-level=high
      - name: Generar SBOM con Trivy
        if: always()
        run: docker run --rm -v "$PWD":/work aquasec/trivy:latest fs --format cyclonedx --output /work/sbom.json /work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.json
